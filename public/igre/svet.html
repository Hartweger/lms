<!doctype html>
<html lang="sr-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Свет око нас за други разред</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --pozadina:#FFF8EC; --karta:#FFFFFF; --mastilo:#2A2433; --tiho:#6B6275;
  --linija:#EADFCB; --tacno:#1F9D55; --tacno-svetlo:#E3F6EA;
  --skoro:#C26A00; --skoro-svetlo:#FFF1DC; --pogresno-svetlo:#FDECE6;
  --skola:#3B7DD8; --drugari:#E0603A; --simboli:#C8323C; --porodica:#D6457A;
  --potrebe:#8A4FD3; --zdravlje:#1F9D55; --ishrana:#E5A100; --igra:#2E9E9E; --kontrolni:#1F9D55;
  --zvezda:#FFB800;
  --senka:0 2px 0 rgba(42,36,51,.08), 0 6px 18px rgba(42,36,51,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pozadina);color:var(--mastilo)}
body{font-family:"Andika",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.4;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.omot{max-width:760px;margin:0 auto;padding:12px 16px 40px}

/* zaglavlje */
.vrh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.vrh h1{font-size:22px;margin:0;flex:1;line-height:1.15}
.vrh .nazad{width:44px;height:44px;border-radius:14px;background:var(--karta);box-shadow:var(--senka);font-size:22px;display:grid;place-items:center}
.zvezde-brojac{display:flex;align-items:center;gap:4px;background:var(--karta);border-radius:999px;padding:6px 12px;box-shadow:var(--senka);font-weight:700}
.ikona-dugme{width:44px;height:44px;border-radius:14px;background:var(--karta);box-shadow:var(--senka);font-size:20px;display:grid;place-items:center}

/* pocetna */
.pozdrav{background:var(--karta);border-radius:22px;padding:16px 18px;box-shadow:var(--senka);margin-bottom:18px;display:flex;gap:14px;align-items:center}
.pozdrav .lik{font-size:44px;line-height:1}
.pozdrav b{font-size:22px;display:block}
.pozdrav span{color:var(--tiho)}
.odeljak{margin:20px 0 8px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--tiho);font-weight:700}
.plocice{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.plocica{background:var(--karta);border-radius:20px;padding:14px 14px 12px;text-align:left;box-shadow:var(--senka);border-bottom:5px solid var(--boja);display:flex;flex-direction:column;gap:4px;min-height:118px;transition:transform .12s}
.plocica:active{transform:scale(.97)}
.plocica .em{font-size:30px;line-height:1}
.plocica b{font-size:18px;line-height:1.15}
.plocica small{color:var(--tiho);font-size:14px;line-height:1.25}
.plocica.siroka{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;min-height:0}
.plocica.siroka .em{font-size:38px}
.plocica.mala{min-height:0}

/* zadatak */
.napredak{display:flex;gap:5px;margin:0 0 14px}
.napredak i{flex:1;height:8px;border-radius:4px;background:var(--linija)}
.napredak i.gotov{background:var(--boja)}
.napredak i.sad{background:var(--boja);opacity:.4}
.karta{background:var(--karta);border-radius:24px;padding:20px 18px;box-shadow:var(--senka);position:relative}
.uputa{color:var(--tiho);font-size:16px;text-align:center;margin:0 0 6px}
.prikaz{display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:center;text-align:center}
.pitanje{font-size:23px;font-weight:700;line-height:1.35;text-align:center}
.tvrdnja{font-size:24px;font-weight:700;line-height:1.35;text-align:center;background:var(--pozadina);border-radius:18px;padding:14px 16px}
.emo{font-size:84px;line-height:1.05;display:inline-block}
.emo.srednji{font-size:56px}
.povratna{margin-top:10px;font-size:18px;border-radius:14px;text-align:center;min-height:1.4em}
.povratna.tacno{color:var(--tacno);font-weight:700}
.povratna.skoro{background:var(--skoro-svetlo);color:#7A4300;padding:10px 14px}
.objasni{background:var(--tacno-svetlo);border-radius:14px;padding:10px 14px;margin-top:10px;font-size:18px;text-align:left}
.objasni::before{content:"📘 "}
.objasni.lose{background:var(--pogresno-svetlo)}

/* izbori */
.izbori{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.izbori.dva{grid-template-columns:repeat(2,1fr)}
.izbor{min-height:58px;border-radius:18px;background:#F4EEE3;font-size:20px;font-weight:700;box-shadow:0 3px 0 #DDD2BF;padding:10px 14px;transition:transform .06s;text-align:left;line-height:1.25}
.izbori.dva .izbor{text-align:center;font-size:24px;min-height:76px}
.izbor:active{transform:translateY(2px)}
.izbor:disabled{opacity:.3;box-shadow:none}
.izbor.dobar{background:var(--tacno);color:#fff;box-shadow:0 3px 0 #15703C;opacity:1}
.izbor.los{background:var(--pogresno-svetlo);color:#A23A1A;opacity:1;box-shadow:none}
.izbor .ik{font-size:26px;margin-right:6px;vertical-align:middle}
.izbor.trese,.trese{animation:trese .35s}
.kategorije{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.kategorije .izbor{text-align:center;font-size:19px;display:flex;flex-direction:column;align-items:center;gap:2px}
.kategorije .izbor .ik{font-size:34px;margin:0}

.pomoc-dugme{display:block;margin:14px auto 0;background:#FFF4C7;color:#6B5200;border-radius:999px;padding:10px 20px;font-size:18px;font-weight:700;box-shadow:0 2px 0 #EAD98F}
.pomoc{background:#FFF9E0;border-left:5px solid #F2C94C;border-radius:12px;padding:10px 12px;font-size:18px;margin-top:10px;text-align:left}
.pomoc::before{content:"💡 "}
.dalje{display:block;margin:16px auto 0;background:var(--boja);color:#fff;border-radius:16px;padding:14px 28px;font-size:20px;font-weight:700}

/* zastava */
.zastava{width:min(300px,100%);aspect-ratio:3/2;border-radius:10px;overflow:hidden;box-shadow:0 0 0 3px var(--mastilo);display:grid;grid-template-rows:repeat(3,1fr);margin:6px auto}
.zastava button{border-top:2px dashed rgba(42,36,51,.25);font-size:15px;color:var(--tiho);font-weight:700}
.zastava button:first-child{border-top:0}
.paleta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.paleta button{width:56px;height:56px;border-radius:50%;background:var(--b);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--linija)}
.paleta button.izabrana{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--mastilo);transform:scale(1.08)}

/* obroci redom */
.redosled{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.redosled div{display:flex;align-items:center;gap:10px;background:var(--pozadina);border-radius:14px;padding:8px 12px;min-height:52px;font-size:19px}
.redosled div i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--linija);display:grid;place-items:center;font-size:15px;font-weight:700;flex:none}
.redosled div.puno{background:var(--tacno-svetlo);font-weight:700}
.redosled div.puno i{background:var(--tacno);color:#fff}

/* kraj */
.kraj{text-align:center}
.kraj .slicica-nova{font-size:96px;line-height:1;margin:10px 0;animation:skok .7s}
.kraj h2{margin:6px 0 4px;font-size:28px}
.kraj p{color:var(--tiho);margin:4px 0 14px}
.dugmad{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.dugme{border-radius:16px;padding:14px 22px;font-size:19px;font-weight:700;background:#F4EEE3;box-shadow:0 3px 0 #DDD2BF}
.dugme.glavno{background:var(--boja);color:#fff;box-shadow:none}
.greske{text-align:left;margin:14px 0;display:flex;flex-direction:column;gap:8px}
.greske div{background:var(--pozadina);border-radius:14px;padding:10px 12px;font-size:17px}
.greske div b{color:var(--tacno)}
.ocena{font-size:56px;font-weight:700;color:var(--boja);line-height:1}

/* album */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.album div{aspect-ratio:1;border-radius:16px;background:var(--karta);box-shadow:var(--senka);display:grid;place-items:center;font-size:36px}
.album div.prazno{background:transparent;box-shadow:none;border:2px dashed var(--linija);font-size:18px;color:var(--linija)}
.statistika{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.statistika div{background:var(--karta);border-radius:16px;padding:10px 14px;box-shadow:var(--senka);flex:1;min-width:130px}
.statistika b{display:block;font-size:26px}

/* izbor lekcije */
.teme{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tema{background:var(--karta);border-radius:18px;padding:14px;text-align:left;box-shadow:var(--senka);border-left:6px solid var(--boja);display:flex;gap:10px;align-items:center}
.tema .em{font-size:32px}
.tema b{display:block;font-size:18px;line-height:1.15}
.tema small{color:var(--tiho);font-size:14px}
.tema.siroka{grid-column:1/-1}

/* memorija */
.memorija{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:560px){.memorija{grid-template-columns:repeat(4,1fr)}}
.kartica{aspect-ratio:1/1.05;border-radius:16px;background:var(--igra);color:#fff;font-size:17px;font-weight:700;box-shadow:0 3px 0 #1E6B6B;display:grid;place-items:center;padding:6px;line-height:1.15;overflow:hidden;text-align:center}
.kartica.okrenuta{background:var(--karta);color:var(--mastilo);box-shadow:var(--senka)}
.kartica.okrenuta.pojam{color:var(--boja);font-size:21px}
.kartica.par{background:var(--tacno-svetlo);color:var(--tacno);box-shadow:none}
.kartica .poledjina{font-size:30px;opacity:.85}

/* podseti se (lekcija) */
.zavesa{position:fixed;inset:0;background:rgba(42,36,51,.45);display:flex;align-items:flex-end;justify-content:center;z-index:8;padding:12px}
@media (min-width:560px){.zavesa{align-items:center}}
.uputstvo{background:var(--karta);border-radius:24px;padding:18px 16px 16px;max-width:620px;width:100%;max-height:90vh;overflow:auto}
.lek-vrh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lek-vrh h2{flex:1;margin:0;font-size:22px;line-height:1.2}
.lek-vrh button{width:40px;height:40px;border-radius:12px;background:var(--pozadina);font-size:18px;flex:none}
.strana{color:var(--tiho);font-size:14px;margin:0 0 8px}
.cinjenice{list-style:none;margin:8px 0 14px;padding:0;display:flex;flex-direction:column;gap:8px}
.cinjenice li{background:var(--pozadina);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:18px;line-height:1.4}
.cinjenice li .ik{font-size:28px;line-height:1.1;flex:none}
.prava{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.prava div{border-radius:14px;padding:10px 12px;font-size:16px;line-height:1.35}
.prava div b{display:block;font-size:14px;letter-spacing:.05em;margin-bottom:2px}
.prava .pravo{background:#FCE8F0}.prava .pravo b{color:#B0306A}
.prava .obaveza{background:#EDE6FA}.prava .obaveza b{color:#6A3BB0}
@media (max-width:420px){.prava{grid-template-columns:1fr}}

.leteca{position:fixed;font-size:34px;pointer-events:none;animation:leti 1s forwards;z-index:9}
@keyframes leti{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1;transform:translateY(-10px) scale(1.2)}100%{opacity:0;transform:translateY(-90px) scale(1)}}
@keyframes trese{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes skok{0%{transform:scale(.2)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:400px){.emo{font-size:70px}.pitanje{font-size:21px}.tvrdnja{font-size:21px}.izbor{font-size:18px}}
</style>
</head>

<div class="omot" id="app"></div>

<script>

const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

      R.gotovo = true; b.classList.add("dobar");
      dugmad.forEach(x => { if (x !== b) x.disabled = true; });
      pov.className = "povratna tacno"; pov.textContent = pick(["Браво!", "Тачно!", "Супер!", "Одлично!"]);
      if (R.greske === 0) { R.zv++; R.tacnih++; zvezdica(b); }
      if (z.obj) { posle.innerHTML = `<div class="objasni">${z.obj}</div><button class="dalje" id="dalje">Даље →</button>`; document.getElementById("dalje").onclick = () => { R.i++; sledece(); }; }
      else setTimeout(() => { R.i++; sledece(); }, 1100);
      return;
    }
    R.greske++;
    /* kontrolni i tačno/netačno: jedan pokušaj, pa pokažemo tačan odgovor */
    if (test || z.t || R.greske >= 2) {
      R.gotovo = true; b.classList.add("los"); dobro.classList.add("dobar");
      dugmad.forEach(x => { if (x !== b && x !== dobro) x.disabled = true; });
      if (R.greske === 1 || test) R.promaseni.push(z);
      pov.className = "povratna skoro"; pov.textContent = `Тачан одговор: ${tacanTekst(z)}`;
      posle.innerHTML = `${z.obj ? `<div class="objasni lose">${z.obj}</div>` : ""}<button class="dalje" id="dalje">Даље →</button>`;
      document.getElementById("dalje").onclick = () => { R.i++; sledece(); };
      return;
    }
    b.disabled = true; b.classList.remove("trese"); void b.offsetWidth; b.classList.add("trese");
    pov.className = "povratna skoro"; pov.textContent = "Скоро! Пробај још једном.";
  }
  function krajKontrolnog() {
    const n = R.n, t = R.tacnih, s = novaSlicica();
    S.kontrolni = { t, n, d: new Date().toISOString().slice(0, 10) }; sacuvaj();
    zvoni("kraj");
    const poruka = t === n ? "Све тачно! Спреман/спремна си за контролни! 🏆" : t >= n * .8 ? "Одлично! Још мало па савршено." : t >= n * .5 ? "Добро је! Прочитај лекције и пробај опет." : "Хајде да прочитамо лекције 📚 па опет.";
    app.innerHTML = zaglavlje(`${R.g.em} ${R.g.ime}`, true) + `
      <div class="karta kraj" style="--boja:${boja(R.g.boja)}">
        <h2>Готово! 🎉</h2>
        <div class="ocena">${t} / ${n}</div>
        <p>${poruka}</p>
        ${R.promaseni.length ? `<p style="text-align:left;color:var(--mastilo);font-weight:700;margin-bottom:0">Подсети се:</p><div class="greske">${R.promaseni.map(z => `<div>${z.t || z.p}<br><b>✓ ${tacanTekst(z)}</b>${z.obj ? `<br><span style="color:var(--tiho)">${z.obj}</span>` : ""}</div>`).join("")}</div>` : ""}
        <div class="slicica-nova">${s}</div>
        <p>Нова сличица је у албуму!</p>
        <div class="dugmad"><button class="dugme glavno" id="opet">Нови контролни</button><button class="dugme" data-a="pocetna">Почетна</button></div>
      </div>`;
    document.getElementById("opet").onclick = () => pokreni("kontrolni");
  }

  /* ---------- razvrstaj ---------- */
  function razvrstaj() {
    const sk = RAZVRSTAJ[R.izbor], g = R.g;
    const st = shuffle(sk.st).slice(0, 10);
    const V = { i: 0, n: st.length, zv: 0 };
    const crtaj = () => {
      if (V.i >= V.n) return kraj(g, V.zv, () => pokreni("razvrstaj", R.izbor));
      const [e, t, k] = st[V.i];
      let greska = false;
      app.innerHTML = zaglavlje(`${sk.em} ${sk.ime}`, true) + `
        <div style="--boja:${boja(sk.boja)}">${tackice(V.n, V.i)}
        <div class="karta"><p class="uputa">Где ово припада?</p>
          <div class="prikaz"><span class="emo">${e}</span><div class="pitanje">${t}</div></div>
          <div class="kategorije">${sk.kat.map(([kid, ime, ik], j) => `<button class="izbor" data-j="${j}"><span class="ik">${ik}</span>${ime}</button>`).join("")}</div>
          <div class="povratna" id="povratna"></div></div></div>`;
      app.querySelectorAll(".kategorije .izbor").forEach(b => b.onclick = () => {
        const kid = sk.kat[+b.dataset.j][0];
        if (kid === k) {
          b.classList.add("dobar"); app.querySelectorAll(".kategorije .izbor").forEach(x => x.onclick = null);
          if (!greska) { V.zv++; zvezdica(b); } else zvoni();
          setTimeout(() => { V.i++; crtaj(); }, 900);
        } else {
          greska = true; b.disabled = true; b.classList.remove("trese"); void b.offsetWidth; b.classList.add("trese");
          const pv = document.getElementById("povratna"); pv.className = "povratna skoro"; pv.textContent = "Размисли још мало 🤔";
        }
      });
    };
    crtaj();
  }

  /* ---------- memorija ---------- */
  function memorija() {
    const sk = MEMORIJA[R.izbor], g = R.g;
    const karte = shuffle(sk.parovi.flatMap((p, i) => [{ i, t: p[0], pojam: true }, { i, t: p[1], pojam: false }]));
    let otvorene = [], parova = 0, zauzeto = false;
    app.innerHTML = zaglavlje(`🃏 ${sk.ime}`, true) + `
      <p style="margin:0 0 12px;color:var(--tiho)">Окрени две карте. Нађи појам и шта он значи.</p>
      <div class="memorija" style="--boja:${boja(sk.boja)}">${karte.map((k, i) => `<button class="kartica" data-i="${i}"><span class="poledjina">?</span></button>`).join("")}</div>`;
    const dugmad = [...app.querySelectorAll(".kartica")];
    dugmad.forEach(b => b.onclick = () => {
      const i = +b.dataset.i, k = karte[i];
      if (zauzeto || b.classList.contains("okrenuta") || b.classList.contains("par")) return;
      b.classList.add("okrenuta"); if (k.pojam) b.classList.add("pojam"); b.textContent = k.t; otvorene.push(i);
      if (otvorene.length === 2) {
        const [x, y] = otvorene; otvorene = [];
        if (karte[x].i === karte[y].i) {
          [x, y].forEach(j => dugmad[j].classList.add("par")); parova++; zvezdica(dugmad[y]);
          if (parova === sk.parovi.length) setTimeout(() => kraj(g, parova, () => pokreni("memorija", R.izbor)), 900);
        } else {
          zauzeto = true;
          setTimeout(() => { [x, y].forEach(j => { dugmad[j].classList.remove("okrenuta", "pojam"); dugmad[j].innerHTML = `<span class="poledjina">?</span>`; }); zauzeto = false; }, 1300);
        }
      }
    });
  }

  /* ---------- obojimo zastavu ---------- */
  function zastava() {
    const g = R.g;
    const BOJE = [["crvena", "#C6363C", "црвена"], ["plava", "#0C4076", "плава"], ["bela", "#FFFFFF", "бела"], ["zelena", "#2BA84A", "зелена"], ["zuta", "#FFD21F", "жута"], ["crna", "#222222", "црна"]];
    const TACNO = ["crvena", "plava", "bela"];
    const pruge = [null, null, null];
    let izab = null, pokusaj = 0;
    app.innerHTML = zaglavlje(`${g.em} ${g.ime}`, true) + `
      <div class="karta" style="--boja:${boja(g.boja)}">
        <p class="uputa">Изабери боју, па додирни пругу. Обој заставу Републике Србије!</p>
        <div class="zastava" id="zastava">${pruge.map((_, j) => `<button data-p="${j}">${["горе", "у средини", "доле"][j]}</button>`).join("")}</div>
        <div class="paleta">${BOJE.map(([id, c, ime]) => `<button data-b="${id}" style="--b:${c}" aria-label="${ime}"></button>`).join("")}</div>
        <div class="povratna" id="povratna"></div>
        <div id="posle"><button class="dalje" id="proveri">Провери</button></div>
      </div>`;
    const pov = document.getElementById("povratna");
    app.querySelectorAll(".paleta button").forEach(b => b.onclick = () => {
      app.querySelectorAll(".paleta button").forEach(x => x.classList.remove("izabrana")); b.classList.add("izabrana"); izab = b.dataset.b;
    });
    app.querySelectorAll("#zastava button").forEach(b => b.onclick = () => {
      if (!izab) { pov.className = "povratna skoro"; pov.textContent = "Прво изабери боју у кругу доле 👇"; return; }
      const c = BOJE.find(x => x[0] === izab); pruge[+b.dataset.p] = izab;
      b.style.background = c[1]; b.textContent = ""; pov.textContent = ""; pov.className = "povratna";
    });
    document.getElementById("proveri").onclick = () => {
      if (pruge.includes(null)) { pov.className = "povratna skoro"; pov.textContent = "Обој све три пруге."; return; }
      pokusaj++;
      if (pruge.every((p, j) => p === TACNO[j])) {
        const zv = pokusaj === 1 ? 3 : 1;
        for (let i = 0; i < zv; i++) zvezdica(document.getElementById("zastava"));
        pov.className = "povratna tacno"; pov.textContent = "Браво! Црвена, плава, бела 🇷🇸";
        document.getElementById("posle").innerHTML = `<div class="objasni">На застави се налази и грб: двоглави бели орао на црвеном штиту, а изнад њега краљевска круна.</div><button class="dalje" id="dalje">Даље →</button>`;
        document.getElementById("dalje").onclick = () => kraj(g, zv, () => pokreni("zastava"));
      } else {
        const lose = pruge.map((p, j) => p === TACNO[j] ? null : ["горња", "средња", "доња"][j]).filter(Boolean);
        pov.className = "povratna skoro"; pov.textContent = `Није још. Погледај: ${lose.join(", ")} ${lose.length > 1 ? "пруге" : "пруга"}. Подсети се 📚 у лекцији.`;
      }
    };
  }

  /* ---------- obroci redom ---------- */
  function obroci() {
    const g = R.g;
    const RED = [["dorucak", "🍳", "Доручак"], ["uzina", "🍎", "Ужина"], ["rucak", "🍲", "Ручак"], ["uzina", "🥪", "Ужина"], ["vecera", "🥗", "Вечера"]];
    const dugmad = shuffle(RED.map((r, j) => ({ r, j })));
    let k = 0, greske = 0;
    app.innerHTML = zaglavlje(`${g.em} ${g.ime}`, true) + `
      <div class="karta" style="--boja:${boja(g.boja)}">
        <p class="uputa">Поређај оброке током дана, од јутра до вечери. Додирни их редом.</p>
        <div class="redosled" id="red">${RED.map((_, j) => `<div><i>${j + 1}</i><span></span></div>`).join("")}</div>
        <div class="kategorije" id="ponuda">${dugmad.map((d, j) => `<button class="izbor" data-j="${j}"><span class="ik">${d.r[1]}</span>${d.r[2]}</button>`).join("")}</div>
        <div class="povratna" id="povratna"></div>
        <div id="posle"></div>
      </div>`;
    const mesta = [...document.querySelectorAll("#red div")], pov = document.getElementById("povratna");
    app.querySelectorAll("#ponuda .izbor").forEach(b => b.onclick = () => {
      const d = dugmad[+b.dataset.j];
      if (d.r[0] === RED[k][0]) {
        b.remove();
        mesta[k].classList.add("puno"); mesta[k].querySelector("span").textContent = `${d.r[1]} ${d.r[2]}`; k++; zvoni();
        pov.textContent = ""; pov.className = "povratna";
        if (k === RED.length) {
          const zv = Math.max(1, 5 - greske);
          for (let i = 0; i < zv; i++) zvezdica(document.getElementById("red"));
          pov.className = "povratna tacno"; pov.textContent = "Браво! Три оброка и две ужине.";
          document.getElementById("posle").innerHTML = `<div class="objasni">Редовна исхрана значи три оброка (доручак, ручак и вечеру) и две ужине.</div><button class="dalje" id="dalje">Даље →</button>`;
          document.getElementById("dalje").onclick = () => kraj(g, zv, () => pokreni("obroci"));
        }
      } else {
        greske++; b.classList.remove("trese"); void b.offsetWidth; b.classList.add("trese");
        pov.className = "povratna skoro"; pov.textContent = k === 0 ? "Шта једемо прво ујутру?" : `Шта долази после: ${RED[k - 1][2].toLowerCase()}?`;
      }
    });
  }

  /* ---------- kraj igre ---------- */
  function kraj(g, zv, opet, poruka) {
    const s = novaSlicica(); zvoni("kraj");
    app.innerHTML = zaglavlje(`${g.em} ${g.ime}`, true) + `
      <div class="karta kraj" style="--boja:${boja(g.boja)}">
        <h2>Браво! 🎉</h2>
        <p>${poruka || `У овој игри: ⭐ ${zv}`}</p>
        <div class="slicica-nova">${s}</div>
        <p>Нова сличица је у албуму!</p>
        <div class="dugmad"><button class="dugme glavno" id="opet">Још једном</button><button class="dugme" data-a="pocetna">Почетна</button></div>
      </div>`;
    document.getElementById("opet").onclick = opet;
  }

  /* ---------- lekcija (podseti se) ---------- */
  function lekcija(id) {
    const l = LEKCIJE[id];
    const z = document.createElement("div"); z.className = "zavesa"; document.body.appendChild(z);
    const zatvori = () => { z.remove(); document.removeEventListener("keydown", esc); };
    const esc = e => { if (e.key === "Escape") zatvori(); };
    document.addEventListener("keydown", esc);
    z.onclick = e => { if (e.target === z) zatvori(); };
    const igra = { porodica: "rodbina", simboli: "zastava", ishrana: "obroci" }[id];
    const razv = Object.entries(RAZVRSTAJ).find(([, s]) => s.lek === id);
    z.innerHTML = `<div class="uputstvo" style="--boja:${boja(l.boja)}" role="dialog" aria-label="${l.ime}">
      <div class="lek-vrh"><h2>${l.em} ${l.ime}</h2><button id="lekX" aria-label="Затвори">✕</button></div>
      <p class="strana">Уџбеник, стр. ${l.str}</p>
      <ul class="cinjenice">${l.podseti.map(([ik, t]) => `<li><span class="ik">${ik}</span><span>${t}</span></li>`).join("")}</ul>
      ${l.pravo ? `<div class="prava"><div class="pravo"><b>ИМАМ ПРАВО…</b>…${l.pravo}.</div><div class="obaveza"><b>ИМАМ ОБАВЕЗУ…</b>…${l.obaveza}.</div></div>` : ""}
      <div class="dugmad">
        <button class="dugme glavno" data-ig="kviz">❓ Квиз</button>
        <button class="dugme" data-ig="tn">✅ Тачно/нетачно</button>
        ${razv ? `<button class="dugme" data-ig="razvrstaj" data-sk="${razv[0]}">${razv[1].em} ${razv[1].ime}</button>` : ""}
        ${igra ? `<button class="dugme" data-ig="${igra}">${IGRE[igra].em} ${IGRE[igra].ime}</button>` : ""}
      </div></div>`;
    z.querySelector("#lekX").onclick = zatvori;
    z.querySelectorAll("[data-ig]").forEach(b => b.onclick = () => {
      zatvori();
      const ig = b.dataset.ig;
      if (ig === "razvrstaj") pokreni("razvrstaj", b.dataset.sk);
      else if (IGRE[ig].lekcija) pokreni(ig, id);
      else pokreni(ig);
    });
  }

  /* ---------- globalni klikovi ---------- */
  document.addEventListener("click", e => {
    const a = e.target.closest("[data-a]"), ig = e.target.closest("[data-igra]"), lk = e.target.closest("[data-lek]");
    if (a) {
      if (a.dataset.a === "pocetna") pocetna();
      else if (a.dataset.a === "album") album();
      else if (a.dataset.a === "podseti" && R && R.lek) lekcija(R.lek);
      else if (a.dataset.a === "zvuk") { S.zvuk = !S.zvuk; sacuvaj(); a.textContent = S.zvuk ? "🔔" : "🔕"; }
    } else if (ig) otvori(ig.dataset.igra);
    else if (lk) lekcija(lk.dataset.lek);
  });

  pocetna();
}
if (typeof module !== "undefined") module.exports = { LEKCIJE, RAZVRSTAJ, MEMORIJA };
</script>
</body>
</html>
